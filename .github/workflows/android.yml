                      color = Color.White,
                      fontSize = 9.sp,
                      fontWeight = FontWeight.Bold
                  )
              }
          }

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          private fun StickerBadge(sticker: Sticker, running: Boolean) {
              val transition = rememberInfiniteTransition(label = "sticker")
              val pulse by transition.animateFloat(
                  initialValue = 0.7f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(700), RepeatMode.Reverse),
                  label = "pulse"
              )
              val slow by transition.animateFloat(
                  initialValue = 0.5f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(1600), RepeatMode.Reverse),
                  label = "slow"
              )
              val shift by transition.animateFloat(
                  initialValue = -10f,
                  targetValue = 10f,
                  animationSpec = infiniteRepeatable(tween(1200), RepeatMode.Reverse),
                  label = "shift"
              )
              val zoom by transition.animateFloat(
                  initialValue = 0.94f,
                  targetValue = 1.05f,
                  animationSpec = infiniteRepeatable(tween(900), RepeatMode.Reverse),
                  label = "zoom"
              )

              val label = if (sticker.kind == StickerKind.MARQUEE && running) {
                  ("${sticker.emoji}  ${sticker.text}      ").repeat(4)
              } else {
                  "${sticker.emoji}  ${sticker.text}"
              }

              Surface(
                  color = Color(0xFFE53935),
                  shape = RoundedCornerShape(10.dp),
                  modifier = Modifier
                      .fillMaxWidth(0.8f)
                      .graphicsLayer {
                          if (running) {
                              when (sticker.kind) {
                                  StickerKind.PULSE -> alpha = pulse
                                  StickerKind.FADE -> alpha = slow
                                  StickerKind.SLIDE -> translationX = shift * density
                                  StickerKind.ZOOM -> {
                                      scaleX = zoom
                                      scaleY = zoom
                                  }
                                  StickerKind.MARQUEE -> Unit
                              }
                          }
                      }
              ) {
                  val base = Modifier.padding(horizontal = 10.dp, vertical = 6.dp)
                  Text(
                      text = label,
                      modifier = if (sticker.kind == StickerKind.MARQUEE && running) {
                          base.fillMaxWidth().basicMarquee(iterations = Int.MAX_VALUE)
                      } else {
                          base
                      },
                      color = Color.White,
                      fontWeight = FontWeight.Bold,
                      fontSize = 13.sp,
                      maxLines = 1,
                      softWrap = false,
                      overflow = TextOverflow.Ellipsis
                  )
              }
          }

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          private fun TickerBar(text: String, running: Boolean) {
              val shown = if (running) (text + "      •      ").repeat(4) else text
              Surface(color = Color(0xCC000000), shape = RoundedCornerShape(6.dp)) {
                  val base = Modifier
                      .fillMaxWidth()
                      .padding(horizontal = 8.dp, vertical = 5.dp)
                  Text(
                      text = shown,
                      modifier = if (running) base.basicMarquee(iterations = Int.MAX_VALUE) else base,
                      color = Color.White,
                      fontSize = 11.sp,
                      maxLines = 1,
                      softWrap = false,
                      overflow = TextOverflow.Ellipsis
                  )
              }
          }
