      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error title=APK not found::Khong tim thay $APK sau khi build"
            find app/build/outputs -type f || true
            exit 1
          fi
          ls -l "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveOverlayStudio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LiveOverlayStudio-build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
