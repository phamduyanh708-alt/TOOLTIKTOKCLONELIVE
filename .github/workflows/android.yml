          package com.example.liveoverlaystudio.video

          import android.content.Context
          import android.graphics.Bitmap
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.provider.OpenableColumns
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          /**
           * Module video (tách riêng để phát triển tiếp sau này).
           *
           * Hiện tại CHỈ hỗ trợ video cục bộ do người dùng tự chọn trên thiết bị
           * và CHỈ lấy 1 khung hình đầu tiên làm nền cho vùng xem trước.
           * Chưa phát video, chưa ghép overlay vào video, chưa phát livestream.
           */
          interface VideoSource {
              suspend fun displayName(context: Context): String
              suspend fun loadPreviewFrame(context: Context): Result<Bitmap>
          }

          class LocalVideoSource(private val uri: Uri) : VideoSource {

              override suspend fun displayName(context: Context): String = withContext(Dispatchers.IO) {
                  var name: String? = null
                  try {
                      val cursor = context.contentResolver.query(
                          uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null
                      )
                      if (cursor != null) {
                          try {
                              if (cursor.moveToFirst()) {
                                  val index = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                                  if (index >= 0) name = cursor.getString(index)
                              }
                          } finally {
                              cursor.close()
                          }
                      }
                  } catch (e: Exception) {
                      name = null
                  }
                  name ?: DEFAULT_NAME
              }

              override suspend fun loadPreviewFrame(context: Context): Result<Bitmap> =
                  withContext(Dispatchers.IO) {
                      val retriever = MediaMetadataRetriever()
                      try {
                          retriever.setDataSource(context, uri)
                          val frame = retriever.getFrameAtTime(0L, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                          if (frame == null) {
                              Result.failure<Bitmap>(IllegalStateException("không đọc được khung hình"))
                          } else {
                              Result.success(downscale(frame))
                          }
                      } catch (e: Exception) {
                          Result.failure<Bitmap>(e)
                      } catch (e: OutOfMemoryError) {
                          Result.failure<Bitmap>(IllegalStateException("video quá lớn"))
                      } finally {
                          try {
                              retriever.release()
                          } catch (e: Exception) {
                              // bỏ qua lỗi khi giải phóng
                          }
                      }
                  }

              private fun downscale(source: Bitmap): Bitmap {
                  if (source.width <= TARGET_WIDTH) return source
                  val height = (source.height.toLong() * TARGET_WIDTH / source.width).toInt().coerceAtLeast(1)
                  return Bitmap.createScaledBitmap(source, TARGET_WIDTH, height, true)
              }

              private companion object {
                  const val DEFAULT_NAME = "Video đã chọn"
                  const val TARGET_WIDTH = 1280
              }
          }
