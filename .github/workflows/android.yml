              val deleteTarget = deleting
              if (deleteTarget != null) {
                  ConfirmDialog(
                      title = "Xóa sticker?",
                      message = "Xóa \"${deleteTarget.text}\"? Hành động này không thể hoàn tác.",
                      confirmLabel = "Xóa",
                      onConfirm = { vm.deleteSticker(deleteTarget.id) },
                      onDismiss = { deleting = null }
                  )
              }
              if (confirmReset) {
                  ConfirmDialog(
                      title = "Khôi phục sticker mẫu?",
                      message = "Danh sách hiện tại sẽ được thay bằng 10 sticker mẫu.",
                      confirmLabel = "Khôi phục",
                      onConfirm = { vm.restoreDefaultStickers() },
                      onDismiss = { confirmReset = false }
                  )
              }
          }

          @Composable
          private fun StickerCard(
              sticker: Sticker,
              onToggle: (Boolean) -> Unit,
              onEdit: () -> Unit,
              onDelete: () -> Unit
          ) {
              Card(Modifier.fillMaxWidth()) {
                  Row(
                      Modifier
                          .padding(start = 12.dp, top = 8.dp, bottom = 8.dp, end = 4.dp)
                          .alpha(if (sticker.enabled) 1f else 0.55f),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(sticker.emoji, fontSize = 26.sp)
                      Column(
                          Modifier
                              .weight(1f)
                              .padding(horizontal = 10.dp)
                      ) {
                          Text(
                              sticker.text,
                              fontWeight = FontWeight.Bold,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis
                          )
                          Text(
                              "#${sticker.id} • ${sticker.kind.label}",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                      Switch(checked = sticker.enabled, onCheckedChange = onToggle)
                      IconButton(onClick = onEdit) {
                          Icon(Icons.Default.Edit, contentDescription = "Sửa sticker")
                      }
                      IconButton(onClick = onDelete) {
                          Icon(Icons.Default.Delete, contentDescription = "Xóa sticker")
                      }
                  }
              }
          }

          @Composable
          private fun StickerDialog(
              title: String,
              initial: Sticker?,
              onDismiss: () -> Unit,
              onSubmit: (String, String, StickerKind) -> String?
          ) {
              var stickerText by remember { mutableStateOf(initial?.text ?: "") }
              var stickerEmoji by remember { mutableStateOf(initial?.emoji ?: "✨") }
              var kind by remember { mutableStateOf(initial?.kind ?: StickerKind.FADE) }
              var error by remember { mutableStateOf<String?>(null) }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title) },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          OutlinedTextField(
                              value = stickerEmoji,
                              onValueChange = {
                                  stickerEmoji = it.take(Limits.MAX_EMOJI)
                                  error = null
                              },
                              label = { Text("Emoji") },
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth()
                          )
                          OutlinedTextField(
                              value = stickerText,
                              onValueChange = {
                                  stickerText = it.take(Limits.MAX_STICKER_TEXT)
                                  error = null
                              },
                              label = { Text("Nội dung sticker") },
                              supportingText = { Text("${stickerText.length}/${Limits.MAX_STICKER_TEXT}") },
                              isError = error != null,
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth()
                          )
                          Text("Hiệu ứng", style = MaterialTheme.typography.labelLarge)
                          Row(
                              Modifier.horizontalScroll(rememberScrollState()),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              StickerKind.entries.forEach { k ->
                                  FilterChip(
                                      selected = k == kind,
                                      onClick = { kind = k },
                                      label = { Text(k.label) }
                                  )
                              }
                          }
                          val message = error
                          if (message != null) {
                              Text(message, color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall)
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = {
                          val result = onSubmit(stickerText, stickerEmoji, kind)
                          if (result == null) onDismiss() else error = result
                      }) { Text("Lưu") }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("Hủy") } }
              )
          }
