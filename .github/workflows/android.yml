name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Generate project files
        run: |
          set -e
          mkdir -p "app"
          cat > "app/build.gradle.kts" <<'LOS_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.liveoverlaystudio"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.liveoverlaystudio"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          LOS_EOF
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'LOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Live Overlay Studio"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          LOS_EOF
          mkdir -p "app/src/main/java/com/example/liveoverlaystudio"
          cat > "app/src/main/java/com/example/liveoverlaystudio/MainActivity.kt" <<'LOS_EOF'
          package com.example.liveoverlaystudio

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.lifecycle.ViewModelProvider
          import com.example.liveoverlaystudio.ui.LiveOverlayTheme
          import com.example.liveoverlaystudio.ui.OverlayApp
          import com.example.liveoverlaystudio.ui.OverlayViewModel

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  val viewModel = ViewModelProvider(this)[OverlayViewModel::class.java]
                  setContent {
                      LiveOverlayTheme {
                          OverlayApp(viewModel)
                      }
                  }
              }
          }
          LOS_EOF
          mkdir -p "app/src/main/java/com/example/liveoverlaystudio/data"
          cat > "app/src/main/java/com/example/liveoverlaystudio/data/OverlayRepository.kt" <<'LOS_EOF'
          package com.example.liveoverlaystudio.data

          import android.content.Context
          import android.content.SharedPreferences
          import com.example.liveoverlaystudio.model.AppSettings
          import com.example.liveoverlaystudio.model.DEFAULT_TICKER_TEXT
          import com.example.liveoverlaystudio.model.Limits
          import com.example.liveoverlaystudio.model.Sticker
          import com.example.liveoverlaystudio.model.StickerKind
          import com.example.liveoverlaystudio.model.TickerConfig
          import com.example.liveoverlaystudio.model.Validation
          import com.example.liveoverlaystudio.model.defaultStickers
          import org.json.JSONArray
          import org.json.JSONException
          import org.json.JSONObject

          /**
           * Lưu và đọc cấu hình trên thiết bị bằng SharedPreferences.
           * Dữ liệu hỏng sẽ được bỏ qua hoặc thay bằng giá trị mặc định, không gây crash.
           */
          class OverlayRepository(context: Context) {

              private val prefs: SharedPreferences =
                  context.applicationContext.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

              class LoadedStickers(val stickers: List<Sticker>, val warning: String?)

              fun loadStickers(): LoadedStickers {
                  val raw: String? = try {
                      prefs.getString(KEY_STICKERS, null)
                  } catch (e: ClassCastException) {
                      null
                  }
                  if (raw == null) return LoadedStickers(defaultStickers, null)

                  return try {
                      val array = JSONArray(raw)
                      val result = ArrayList<Sticker>()
                      val seenIds = HashSet<Int>()
                      var skipped = 0
                      for (i in 0 until array.length()) {
                          val sticker = parseSticker(array.optJSONObject(i))
                          if (sticker != null && seenIds.add(sticker.id)) {
                              result.add(sticker)
                          } else {
                              skipped++
                          }
                      }
                      val warning = if (skipped > 0) {
                          "Đã bỏ qua $skipped sticker bị lỗi trong dữ liệu đã lưu."
                      } else {
                          null
                      }
                      LoadedStickers(result.take(Limits.MAX_STICKERS), warning)
                  } catch (e: JSONException) {
                      LoadedStickers(
                          defaultStickers,
                          "Dữ liệu sticker đã lưu bị hỏng, đã khôi phục 10 sticker mẫu."
                      )
                  }
              }

              private fun parseSticker(o: JSONObject?): Sticker? {
                  if (o == null) return null
                  return try {
                      val text = Validation.cleanLine(o.getString("text")).take(Limits.MAX_STICKER_TEXT)
                      if (text.isEmpty()) return null
                      val emoji = Validation.cleanLine(o.optString("emoji", "✨"))
                          .take(Limits.MAX_EMOJI)
                          .ifEmpty { "✨" }
                      Sticker(
                          id = o.getInt("id"),
                          text = text,
                          emoji = emoji,
                          kind = StickerKind.fromName(o.optString("kind", "FADE")),
                          enabled = o.optBoolean("enabled", true)
                      )
                  } catch (e: JSONException) {
                      null
                  }
              }

              fun saveStickers(stickers: List<Sticker>): Boolean = try {
                  val array = JSONArray()
                  stickers.forEach { s ->
                      array.put(
                          JSONObject()
                              .put("id", s.id)
                              .put("text", s.text)
                              .put("emoji", s.emoji)
                              .put("kind", s.kind.name)
                              .put("enabled", s.enabled)
                      )
                  }
                  prefs.edit().putString(KEY_STICKERS, array.toString()).apply()
                  true
              } catch (e: Exception) {
                  false
              }

              fun loadTicker(): TickerConfig = try {
                  val text = Validation.cleanLine(prefs.getString(KEY_TICKER_TEXT, DEFAULT_TICKER_TEXT) ?: "")
                      .take(Limits.MAX_TICKER_TEXT)
                  TickerConfig(
                      text = text.ifEmpty { DEFAULT_TICKER_TEXT },
                      enabled = prefs.getBoolean(KEY_TICKER_ENABLED, true)
                  )
              } catch (e: ClassCastException) {
                  TickerConfig()
              }

              fun saveTicker(ticker: TickerConfig): Boolean = try {
                  prefs.edit()
                      .putString(KEY_TICKER_TEXT, ticker.text)
                      .putBoolean(KEY_TICKER_ENABLED, ticker.enabled)
                      .apply()
                  true
              } catch (e: Exception) {
                  false
              }

              fun loadSettings(): AppSettings = try {
                  AppSettings(
                      overlayEnabled = prefs.getBoolean(KEY_OVERLAY_ENABLED, true),
                      autoRotate = prefs.getBoolean(KEY_AUTO_ROTATE, true),
                      rotateSeconds = prefs.getInt(KEY_ROTATE_SECONDS, Limits.DEFAULT_ROTATE_SECONDS)
                          .coerceIn(Limits.MIN_ROTATE_SECONDS, Limits.MAX_ROTATE_SECONDS)
                  )
              } catch (e: ClassCastException) {
                  AppSettings()
              }

              fun saveSettings(settings: AppSettings): Boolean = try {
                  prefs.edit()
                      .putBoolean(KEY_OVERLAY_ENABLED, settings.overlayEnabled)
                      .putBoolean(KEY_AUTO_ROTATE, settings.autoRotate)
                      .putInt(KEY_ROTATE_SECONDS, settings.rotateSeconds)
                      .apply()
                  true
              } catch (e: Exception) {
                  false
              }

              fun loadVideoUri(): String? = try {
                  prefs.getString(KEY_VIDEO_URI, null)
              } catch (e: ClassCastException) {
                  null
              }

              fun saveVideoUri(uri: String?): Boolean = try {
                  val editor = prefs.edit()
                  if (uri == null) editor.remove(KEY_VIDEO_URI) else editor.putString(KEY_VIDEO_URI, uri)
                  editor.apply()
                  true
              } catch (e: Exception) {
                  false
              }

              fun clearAll(): Boolean = try {
                  prefs.edit().clear().apply()
                  true
              } catch (e: Exception) {
                  false
              }

              private companion object {
                  const val PREFS_NAME = "overlay_prefs"
                  const val KEY_STICKERS = "stickers"
                  const val KEY_TICKER_TEXT = "ticker_text"
                  const val KEY_TICKER_ENABLED = "ticker"
                  const val KEY_OVERLAY_ENABLED = "mixed_enabled"
                  const val KEY_AUTO_ROTATE = "auto_rotate"
                  const val KEY_ROTATE_SECONDS = "rotate_seconds"
                  const val KEY_VIDEO_URI = "video_uri"
              }
          }
          LOS_EOF
          mkdir -p "app/src/main/java/com/example/liveoverlaystudio/model"
          cat > "app/src/main/java/com/example/liveoverlaystudio/model/Models.kt" <<'LOS_EOF'
          package com.example.liveoverlaystudio.model

          const val DEFAULT_TICKER_TEXT = "Thông tin sản phẩm và ưu đãi chính thức"

          object Limits {
              const val MAX_STICKERS = 50
              const val MAX_STICKER_TEXT = 60
              const val MAX_EMOJI = 12
              const val MAX_TICKER_TEXT = 200
              const val MIN_ROTATE_SECONDS = 2
              const val MAX_ROTATE_SECONDS = 15
              const val DEFAULT_ROTATE_SECONDS = 4
          }

          enum class StickerKind(val label: String) {
              PULSE("Nhấp nháy"),
              FADE("Mờ dần"),
              SLIDE("Trượt"),
              MARQUEE("Chạy ngang"),
              ZOOM("Phóng to");

              companion object {
                  fun fromName(name: String?): StickerKind =
                      entries.firstOrNull { it.name == name } ?: FADE
              }
          }

          data class Sticker(
              val id: Int,
              val text: String,
              val emoji: String,
              val kind: StickerKind = StickerKind.FADE,
              val enabled: Boolean = true
          )

          data class TickerConfig(
              val text: String = DEFAULT_TICKER_TEXT,
              val enabled: Boolean = true
          )

          data class AppSettings(
              val overlayEnabled: Boolean = true,
              val autoRotate: Boolean = true,
              val rotateSeconds: Int = Limits.DEFAULT_ROTATE_SECONDS
          )

          val defaultStickers: List<Sticker> = listOf(
              Sticker(1, "DEAL HOT HÔM NAY", "🔥", StickerKind.PULSE),
              Sticker(2, "ƯU ĐÃI ĐẶC BIỆT", "🎁", StickerKind.FADE),
              Sticker(3, "XEM SẢN PHẨM", "🛒", StickerKind.SLIDE),
              Sticker(4, "ƯU ĐÃI ĐANG DIỄN RA", "⚡", StickerKind.MARQUEE),
              Sticker(5, "CẢM ƠN ĐÃ GHÉ XEM", "❤️", StickerKind.FADE),
              Sticker(6, "SẢN PHẨM NỔI BẬT", "🎉", StickerKind.ZOOM),
              Sticker(7, "XEM CHI TIẾT SẢN PHẨM", "💥", StickerKind.SLIDE),
              Sticker(8, "GIÁ VÀ ƯU ĐÃI", "🏷️", StickerKind.FADE),
              Sticker(9, "THÔNG TIN SẢN PHẨM", "📦", StickerKind.SLIDE),
              Sticker(10, "KHÁM PHÁ DANH MỤC", "🛍️", StickerKind.MARQUEE)
          )

          /** Kiểm tra dữ liệu người dùng nhập. Trả về null nếu hợp lệ, hoặc thông báo lỗi tiếng Việt. */
          object Validation {

              fun cleanLine(raw: String): String =
                  raw.replace('\n', ' ').replace('\r', ' ').replace('\t', ' ').trim()

              fun stickerError(text: String, emoji: String): String? {
                  val t = cleanLine(text)
                  val e = cleanLine(emoji)
                  return when {
                      t.isEmpty() -> "Nội dung sticker không được để trống."
                      t.length > Limits.MAX_STICKER_TEXT ->
                          "Nội dung sticker tối đa ${Limits.MAX_STICKER_TEXT} ký tự (hiện có ${t.length})."
                      e.length > Limits.MAX_EMOJI ->
                          "Emoji tối đa ${Limits.MAX_EMOJI} ký tự. Hãy chỉ nhập 1 biểu tượng."
                      else -> null
                  }
              }

              fun tickerError(text: String): String? {
                  val t = cleanLine(text)
                  return when {
                      t.isEmpty() ->
                          "Dòng chữ chạy không được để trống. Hãy tắt dòng chữ chạy nếu bạn không cần."
                      t.length > Limits.MAX_TICKER_TEXT ->
                          "Dòng chữ chạy tối đa ${Limits.MAX_TICKER_TEXT} ký tự (hiện có ${t.length})."
                      else -> null
                  }
              }
          }
          LOS_EOF
          mkdir -p "app/src/main/java/com/example/liveoverlaystudio/ui"
          cat > "app/src/main/java/com/example/liveoverlaystudio/ui/Components.kt" <<'LOS_EOF'
          package com.example.liveoverlaystudio.ui

          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.material3.AlertDialog
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Switch
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight

          @Composable
          fun SectionTitle(text: String) {
              Text(text, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
          }

          @Composable
          fun SettingSwitch(
              label: String,
              checked: Boolean,
              enabled: Boolean = true,
              onChecked: (Boolean) -> Unit
          ) {
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Text(label, modifier = Modifier.weight(1f), style = MaterialTheme.typography.bodyMedium)
                  Switch(checked = checked, onCheckedChange = onChecked, enabled = enabled)
              }
          }

          @Composable
          fun ConfirmDialog(
              title: String,
              message: String,
              confirmLabel: String,
              onConfirm: () -> Unit,
              onDismiss: () -> Unit
          ) {
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title) },
