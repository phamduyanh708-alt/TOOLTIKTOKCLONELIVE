          @Composable
          fun PreviewPanel(
              stickers: List<Sticker>,
              settings: AppSettings,
              ticker: TickerConfig,
              running: Boolean,
              frame: Bitmap?,
              modifier: Modifier = Modifier
          ) {
              val active = stickers.filter { it.enabled }
              var index by remember { mutableIntStateOf(0) }

              LaunchedEffect(running, settings.autoRotate, settings.rotateSeconds, active.size) {
                  if (running && settings.autoRotate && active.size > 1) {
                      while (true) {
                          delay(settings.rotateSeconds * 1000L)
                          index = (index + 1) % active.size
                      }
                  }
